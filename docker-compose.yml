# Local Neo4j for the relationship graph. Start with: docker compose up -d
# Browser UI: http://localhost:7474 (user neo4j, password from NEO4J_AUTH)
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/welcome123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  neo4j_data:
